[versions]
kotlin = "2.4.21"
ktlint = "1.8.0"
ktlintPlugin = "14.2.0"
composeRules = "0.6.8"
ruleset = "0.1.1"
java = "21"

[libraries]
ktlint-engineCore = { module = "com.pinterest.ktlint:ktlint-rule-engine-core", version.ref = "ktlint" }
ktlint-rulesetCore = { module = "com.pinterest.ktlint:ktlint-cli-ruleset-core", version.ref = "ktlint" }
ktlint-composeRules = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRules" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
