name: Publish ruleset

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ruleset-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: maven
          path: build/maven-repository
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release version
        shell: bash
        run: |
          release_version=$(sed -n 's/^ruleset = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          test "$GITHUB_REF_NAME" = "v$release_version"
      - name: Build, lint, and generate Maven repository
        run: ./gradlew --console=plain ktlintCheck publish
      - name: Preserve repository versions
        shell: bash
        run: |
          cd build/maven-repository
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Publish $GITHUB_REF_NAME"
            git push origin HEAD:maven
          fi
      - name: Publish versioned JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          cd build/libs
          sha256sum "matee-ruleset-${release_version}.jar" | cut -d ' ' -f1 > "matee-ruleset-${release_version}.jar.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "matee-ruleset-${release_version}.jar" \
            "matee-ruleset-${release_version}.jar.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
