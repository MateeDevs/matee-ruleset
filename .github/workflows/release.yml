name: Publish ruleset JAR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release version
        shell: bash
        run: |
          release_version=$(sed -n 's/^ruleset = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          test "$GITHUB_REF_NAME" = "v$release_version"
      - name: Build and lint
        run: ./gradlew --console=plain jar ktlintCheck
      - name: Publish versioned JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          cd build/libs
          sha256sum "matee-ruleset-${release_version}.jar" | cut -d ' ' -f1 > "matee-ruleset-${release_version}.jar.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "matee-ruleset-${release_version}.jar" \
            "matee-ruleset-${release_version}.jar.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
